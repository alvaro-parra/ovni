<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>OVNI</title>
    <meta name="description" content="Juego de cartas con baraja española contra bots. Accesible para mayores y peques." />
    <!-- Instalable como app (pantalla completa, sin barra del navegador). Rutas relativas: se publica bajo /ovni/. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0f3a24" />
    <link rel="icon" type="image/png" href="./iconos/icono-192.png" />
    <link rel="apple-touch-icon" href="./iconos/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OVNI" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        margin: 0;
        background: #0f3a24;
        font-family: 'Atkinson Hyperlegible', system-ui, sans-serif;
      }
      * {
        -webkit-tap-highlight-color: transparent;
      }
      /* Foco visible al usar teclado o accesorios (no aparece al tocar con el dedo). */
      :focus-visible {
        outline: 4px solid #ffd23f;
        outline-offset: 3px;
      }
      /* En paneles claros (reglas, palo, ver mejor, salir) el amarillo no contrasta: negro. */
      [data-claro] :focus-visible {
        outline-color: #1a1a1a;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
